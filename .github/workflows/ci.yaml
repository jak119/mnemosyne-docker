name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
      - name: Validate Compose configuration
        env:
          MNEMOSYNE_MCP_TOKEN: ci-test-token
        run: docker compose config --quiet

  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    env:
      MNEMOSYNE_MCP_TOKEN: ci-test-token
      MNEMOSYNE_IMAGE_TAG: ci-test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag ghcr.io/jak119/mnemosyne-docker:ci-test .
      - name: Start service
        run: docker compose up --detach
      - name: Wait for healthy service
        run: |
          for attempt in $(seq 1 30); do
            container_id=$(docker compose ps --quiet mnemosyne)
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs mnemosyne
              exit 1
            fi
            sleep 5
          done
          docker compose logs mnemosyne
          exit 1
      - name: Verify bearer authentication
        run: |
          unauthenticated_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/sse)
          test "$unauthenticated_status" = "401"
          authenticated_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 --header 'Authorization: Bearer ci-test-token' http://127.0.0.1:8080/sse || true)
          test "$authenticated_status" = "200"
      - name: Show service logs
        if: failure()
        run: docker compose logs mnemosyne
      - name: Stop service
        if: always()
        run: docker compose down --volumes

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image metadata
        id: image
        run: |
          requirement=$(<requirements.txt)
          version=${requirement##*==}
          test -n "$version"
          test "$version" != "$requirement"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
