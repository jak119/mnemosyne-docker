      #     test "$sync_auth" = "200" || test "$sync_auth" = "422"
      - uses: docker/login-action@v4
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Publish image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: |
          source_image="$IMAGE_NAME:$MNEMOSYNE_IMAGE_TAG"
          docker tag "$source_image" "$IMAGE_NAME:$IMAGE_VERSION"
          docker tag "$source_image" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$IMAGE_VERSION"
          docker push "$IMAGE_NAME:latest"
      - name: Show service logs
        if: failure()
        run: docker compose logs
      - name: Stop service
        if: always()
        run: docker compose down --volumes
