name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        continue-on-error: true
        with:
          dockerfile: Dockerfile
          format: sarif
          no-fail: true
          output-file: hadolint.sarif
      - uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: hadolint.sarif
      - name: Validate Compose configuration
        env:
          COMPOSE_PROFILES: all
          MNEMOSYNE_MCP_TOKEN: ci-test-token
          MNEMOSYNE_SYNC_API_KEY: ci-sync-token
        run: docker compose config --quiet

  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROFILES: all
      MNEMOSYNE_MCP_TOKEN: ci-test-token
      MNEMOSYNE_SYNC_API_KEY: ci-sync-token
      MNEMOSYNE_IMAGE_TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image metadata
        id: image
        run: |
          requirement=$(<requirements.txt)
          version=${requirement##*==}
          test -n "$version"
          test "$version" != "$requirement"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ env.MNEMOSYNE_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      # - name: Start services
